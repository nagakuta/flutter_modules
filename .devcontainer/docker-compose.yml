version: '3.8'
services:
  flutter_modules:
    build:
      context: ../
      dockerfile: .devcontainer/flutter_modules/Dockerfile
    volumes:
      # Dart files
      - ../packages:/workspace/packages:cached
      - ../.fvmrc:/workspace/.fvmrc:cached
      - ../analysis_options.yaml:/workspace/analysis_options.yaml:cached
      - ../all_lint_rules.yaml:/workspace/all_lint_rules.yaml:cached
      - ../pubspec.lock:/workspace/pubspec.lock:cached
      - ../pubspec.yaml:/workspace/pubspec.yaml:cached
      # Mason files
      - ../mason.yaml:/workspace/mason.yaml:cached
      # Melos files
      - ../melos.yaml:/workspace/melos.yaml:cached
      # VSCode
      - ../.vscode:/workspace/.vscode:cached
      # Git
      - ../.git:/workspace/.git:cached
      - ../.gitattributes:/workspace/.gitattributes:cached
      - ../.gitignore:/workspace/.gitignore:cached
    command: /bin/sh -c "while sleep 1000; do :; done"
    env_file:
      - flutter_modules/.flutter.env
